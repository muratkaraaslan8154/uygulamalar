<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiş & Harcama Analiz Portalı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="text-slate-100 font-sans selection:bg-emerald-500 selection:text-white min-h-full pb-16">

    <!-- ÜST NAVİGASYON BARI -->
    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 shadow-2xl">
        <div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500/20 to-teal-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold text-lg">
                    <i class="fa-solid fa-receipt"></i>
                </div>
                <div>
                    <h1 class="text-sm sm:text-lg font-black text-white tracking-tight">FİŞ & HARCAMA ANALİZİ</h1>
                    <span id="dbStatus" class="px-2 py-0.5 bg-amber-500/10 border border-amber-500/30 text-amber-400 text-[10px] font-bold rounded-full uppercase flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span> Kontrol Ediliyor...
                    </span>
                </div>
            </div>

            <nav class="flex items-center gap-2">
                <a href="kaza_takip.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border border-slate-700">
                    <i class="fa-solid fa-house text-sky-400"></i> Ana Sayfa
                </a>
                <a href="kaza.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border border-slate-700">
                    <i class="fa-solid fa-calculator text-amber-400"></i> Kaza Girişi
                </a>
                <a href="fis_analiz.html" class="px-3.5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold shadow-lg shadow-emerald-900/40 flex items-center gap-1.5">
                    <i class="fa-solid fa-receipt"></i> Fiş Analizi
                </a>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-3 sm:px-4 pt-4 sm:pt-6 space-y-6">

        <!-- FİŞ KAYIT FORMU -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-2xl">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
                <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> Yeni Fiş / Harcama Kaydı
                </h2>
                <span id="formModeTitle" class="text-[11px] text-slate-400 font-semibold">Mod: Yeni Ekle</span>
            </div>

            <form id="receiptForm" onsubmit="saveReceipt(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
                <input type="hidden" id="editReceiptId" value="">
                
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Tarih</label>
                    <input type="date" id="receiptDate" required onclick="this.showPicker && this.showPicker()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 [color-scheme:dark] cursor-pointer">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Mağaza / Market</label>
                    <input type="text" id="storeName" placeholder="Örn: BİM, Migros, Eczane" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Kategori</label>
                    <select id="receiptCategory" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 cursor-pointer">
                        <option value="Market">Market / Gıda</option>
                        <option value="Fatura">Fatura / Abonelik</option>
                        <option value="Ulasim">Ulaşım / Yakıt</option>
                        <option value="Saglik">Sağlık / Eczane</option>
                        <option value="Giyim">Giyim / Aksesuar</option>
                        <option value="Eglence">Eğlence / Restoran</option>
                        <option value="Diger">Diğer</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Tutar (₺)</label>
                    <input type="number" id="receiptAmount" step="0.01" min="0" placeholder="0.00" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-emerald-400 font-bold focus:outline-none focus:border-emerald-500">
                </div>

                <div class="sm:col-span-2 lg:col-span-5 flex gap-2">
                    <input type="text" id="receiptNotes" placeholder="Açıklama / Ürün detayları (isteğe bağlı)" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                    <button type="submit" id="submitBtn" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs transition flex items-center gap-2 shadow-lg shadow-emerald-900/40">
                        <i class="fa-solid fa-floppy-disk"></i> Kaydet
                    </button>
                    <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs transition">
                        İptal
                    </button>
                </div>
            </form>
        </div>

        <!-- İSTATİSTİK PANOLARI -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex items-center justify-between shadow-xl">
                <div>
                    <div class="text-xs text-slate-400 font-semibold">Toplam Harcama</div>
                    <div id="totalSpend" class="text-2xl font-black text-emerald-400 mt-1">₺0,00</div>
                </div>
                <i class="fa-solid fa-wallet text-3xl text-emerald-500/20"></i>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex items-center justify-between shadow-xl">
                <div>
                    <div class="text-xs text-slate-400 font-semibold">Bu Ayki Harcama</div>
                    <div id="thisMonthSpend" class="text-2xl font-black text-sky-400 mt-1">₺0,00</div>
                </div>
                <i class="fa-solid fa-calendar-day text-3xl text-sky-500/20"></i>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex items-center justify-between shadow-xl">
                <div>
                    <div class="text-xs text-slate-400 font-semibold">Toplam Fiş Sayısı</div>
                    <div id="receiptCount" class="text-2xl font-black text-amber-400 mt-1">0 Fiş</div>
                </div>
                <i class="fa-solid fa-file-invoice text-3xl text-amber-500/20"></i>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex items-center justify-between shadow-xl">
                <div>
                    <div class="text-xs text-slate-400 font-semibold">En Yüksek Kategori</div>
                    <div id="topCategory" class="text-lg font-black text-indigo-400 mt-1">-</div>
                </div>
                <i class="fa-solid fa-chart-pie text-3xl text-indigo-500/20"></i>
            </div>
        </div>

        <!-- GRAFİK VE FİLTRELER -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 lg:col-span-1 shadow-2xl">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Kategori Dağılımı</h3>
                <div class="relative h-56"><canvas id="categoryChart"></canvas></div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 lg:col-span-2 shadow-2xl space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-slate-800">
                    <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">
                        <i class="fa-solid fa-filter text-emerald-400"></i> Filtreleme & Arama
                    </h3>
                    <button onclick="clearFilters()" class="text-xs text-slate-400 hover:text-white transition">Filtreleri Temizle</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="text" id="searchInput" oninput="renderReceiptsList()" placeholder="Mağaza veya açıklama ara..." class="bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                    <select id="categoryFilter" onchange="renderReceiptsList()" class="bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white focus:outline-none focus:border-emerald-500 cursor-pointer">
                        <option value="all">Tüm Kategoriler</option>
                        <option value="Market">Market / Gıda</option>
                        <option value="Fatura">Fatura / Abonelik</option>
                        <option value="Ulasim">Ulaşım / Yakıt</option>
                        <option value="Saglik">Sağlık / Eczane</option>
                        <option value="Giyim">Giyim / Aksesuar</option>
                        <option value="Eglence">Eğlence / Restoran</option>
                        <option value="Diger">Diğer</option>
                    </select>
                    <input type="month" id="monthFilter" onchange="renderReceiptsList()" onclick="this.showPicker && this.showPicker()" class="bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-emerald-400 font-bold focus:outline-none focus:border-emerald-500 [color-scheme:dark] cursor-pointer">
                </div>

                <div id="receiptsContainer" class="space-y-2 max-h-[350px] overflow-y-auto pr-1">
                    <div class="text-center py-8 text-slate-500 text-xs">Yükleniyor...</div>
                </div>
            </div>
        </div>

    </main>

    <script>
        // Veritabanı Yapılandırması (kaza_6.html ile aynı)
        const firebaseConfig = {
            apiKey: "AIzaSyD1hbPbA81qldXCsQxSM4Ozxr9L8sdRTMk",
            authDomain: "karaaslanhomebutcetakip.firebaseapp.com",
            databaseURL: "https://karaaslanhomebutcetakip-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "karaaslanhomebutcetakip"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allReceipts = {};
        let categoryChartInst;

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('receiptDate').value = new Date().toISOString().split('T')[0];
            initChart();

            // Bağlantı durumu
            db.ref('.info/connected').on('value', snap => {
                const statusEl = document.getElementById('dbStatus');
                statusEl.innerHTML = snap.val() 
                    ? `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Bulut Bağlandı` 
                    : `<span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span> Bağlantı Yok`;
            });

            // Fişleri Ayrı Bir Klasörden (düğümden) Çek
            db.ref('fisler').on('value', snap => {
                allReceipts = snap.exists() ? snap.val() : {};
                calculateStats();
                renderReceiptsList();
            });
        });

        function saveReceipt(e) {
            e.preventDefault();
            const editId = document.getElementById('editReceiptId').value;
            const receiptData = {
                date: document.getElementById('receiptDate').value,
                store: document.getElementById('storeName').value.trim(),
                category: document.getElementById('receiptCategory').value,
                amount: parseFloat(document.getElementById('receiptAmount').value) || 0,
                notes: document.getElementById('receiptNotes').value.trim(),
                timestamp: Date.now()
            };

            if (editId) {
                db.ref(`fisler/${editId}`).update(receiptData);
            } else {
                db.ref('fisler').push(receiptData);
            }

            resetForm();
        }

        function editReceipt(id) {
            const item = allReceipts[id];
            if (!item) return;

            document.getElementById('editReceiptId').value = id;
            document.getElementById('receiptDate').value = item.date;
            document.getElementById('storeName').value = item.store;
            document.getElementById('receiptCategory').value = item.category;
            document.getElementById('receiptAmount').value = item.amount;
            document.getElementById('receiptNotes').value = item.notes || '';

            document.getElementById('formModeTitle').innerText = "Mod: Düzenle";
            document.getElementById('submitBtn').innerHTML = `<i class="fa-solid fa-pen"></i> Güncelle`;
            document.getElementById('cancelEditBtn').classList.remove('hidden');
        }

        function deleteReceipt(id) {
            if (confirm("Bu fiş kaydını silmek istediğinize emin misiniz?")) {
                db.ref(`fisler/${id}`).remove();
            }
        }

        function resetForm() {
            document.getElementById('receiptForm').reset();
            document.getElementById('editReceiptId').value = '';
            document.getElementById('receiptDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('formModeTitle').innerText = "Mod: Yeni Ekle";
            document.getElementById('submitBtn').innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Kaydet`;
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        function renderReceiptsList() {
            const container = document.getElementById('receiptsContainer');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const month = document.getElementById('monthFilter').value;

            let keys = Object.keys(allReceipts).sort((a, b) => (allReceipts[b].date || '').localeCompare(allReceipts[a].date || ''));

            const filteredKeys = keys.filter(id => {
                const item = allReceipts[id];
                const matchesSearch = item.store.toLowerCase().includes(search) || (item.notes && item.notes.toLowerCase().includes(search));
                const matchesCategory = category === 'all' || item.category === category;
                const matchesMonth = !month || (item.date && item.date.startsWith(month));
                return matchesSearch && matchesCategory && matchesMonth;
            });

            if (filteredKeys.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">Arama kriterlerinize uygun fiş kaydı bulunamadı.</div>`;
                return;
            }

            let html = '';
            filteredKeys.forEach(id => {
                const item = allReceipts[id];
                html += `
                    <div class="bg-slate-950 border border-slate-800/80 p-3 rounded-xl flex items-center justify-between hover:border-slate-700 transition">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-bold text-white">${escapeHtml(item.store)}</span>
                                <span class="px-2 py-0.5 bg-slate-800 text-emerald-400 text-[10px] font-bold rounded-lg border border-slate-700">${item.category}</span>
                            </div>
                            <div class="text-[11px] text-slate-400 flex items-center gap-2">
                                <span><i class="fa-regular fa-calendar text-slate-500"></i> ${item.date}</span>
                                ${item.notes ? `<span>• ${escapeHtml(item.notes)}</span>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-base font-black text-emerald-400">₺${item.amount.toLocaleString('tr-TR', { minimumFractionDigits: 2 })}</span>
                            <div class="flex gap-1">
                                <button onclick="editReceipt('${id}')" class="p-1.5 bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 rounded-lg text-xs transition"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteReceipt('${id}')" class="p-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-lg text-xs transition"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function calculateStats() {
            let total = 0;
            let thisMonthTotal = 0;
            const currentMonthStr = new Date().toISOString().substring(0, 7);
            const catTotals = {};

            const items = Object.values(allReceipts);
            items.forEach(item => {
                const amt = item.amount || 0;
                total += amt;
                if (item.date && item.date.startsWith(currentMonthStr)) {
                    thisMonthTotal += amt;
                }
                catTotals[item.category] = (catTotals[item.category] || 0) + amt;
            });

            document.getElementById('totalSpend').innerText = `₺${total.toLocaleString('tr-TR', { minimumFractionDigits: 2 })}`;
            document.getElementById('thisMonthSpend').innerText = `₺${thisMonthTotal.toLocaleString('tr-TR', { minimumFractionDigits: 2 })}`;
            document.getElementById('receiptCount').innerText = `${items.length} Fiş`;

            let topCat = '-';
            let maxAmt = 0;
            Object.entries(catTotals).forEach(([cat, amt]) => {
                if (amt > maxAmt) { maxAmt = amt; topCat = cat; }
            });
            document.getElementById('topCategory').innerText = topCat;

            updateChart(catTotals);
        }

        function initChart() {
            const ctx = document.getElementById('categoryChart');
            if (!ctx) return;
            categoryChartInst = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: ['#10b981', '#38bdf8', '#f59e0b', '#6366f1', '#ec4899', '#8b5cf6', '#64748b'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } }
                }
            });
        }

        function updateChart(catTotals) {
            if (!categoryChartInst) return;
            categoryChartInst.data.labels = Object.keys(catTotals);
            categoryChartInst.data.datasets[0].data = Object.values(catTotals);
            categoryChartInst.update();
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categoryFilter').value = 'all';
            document.getElementById('monthFilter').value = '';
            renderReceiptsList();
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
