<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KasaPratik: Akıllı Küpür Sayacı</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border: 1px solid var(--border);
    }

    /* Üst Senkronizasyon ve Tarih Alanı */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      margin-bottom: 8px;
    }

    .sync-status {
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.3s;
    }

    .sync-status.syncing { color: var(--warning); }
    .sync-status.synced { color: var(--success); }

    .history-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    select {
      background: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      outline: none;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #2563eb; }

    /* Ana Başlık ve Toplam */
    .header {
      text-align: center;
      border-bottom: 2px dashed var(--border);
      padding-bottom: 4px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .app-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .grand-total {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--success);
      text-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
      line-height: 1.1;
    }

    .grand-total span {
      font-size: 1.2rem;
      color: var(--text-muted);
    }

    /* Liste Alanı */
    .denominations-list {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      gap: 4px;
      min-height: 0;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.2);
      padding: 4px 12px;
      border-radius: 8px;
      border: 2px solid transparent;
      transition: all 0.15s ease;
      flex: 1;
      max-height: 48px;
    }

    .row:focus-within {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.08);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .row.has-value { border-left: 4px solid var(--primary); }
    .row.negative-value { border-left: 4px solid var(--danger); }
    .row.negative-value .count-display { color: var(--danger); }
    .row.negative-value .row-total { color: var(--danger); }

    .label {
      font-size: 1rem;
      font-weight: 700;
      width: 70px;
      color: var(--text-main);
      flex-shrink: 0;
    }

    .input-area {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      padding-left: 5px;
    }

    .multiplier-icon {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    input[type="text"] {
      width: 75px;
      height: 32px;
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      border-radius: 6px;
      outline: none;
      transition: all 0.2s;
    }

    input[type="text"]:focus { border-color: var(--primary); }

    .count-display {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      width: 40px;
      opacity: 0;
      white-space: nowrap;
    }

    .row.has-value .count-display,
    .row.negative-value .count-display { opacity: 1; }

    .row-total {
      width: 85px;
      text-align: right;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .row.has-value .row-total { color: var(--success); }
    
    .footer {
      flex-shrink: 0;
      text-align: center;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .footer-note { font-size: 0.75rem; color: var(--text-muted); }
    .copyright { font-size: 0.75rem; font-weight: 600; color: var(--primary); letter-spacing: 0.5px; }

  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="top-bar">
      <div class="sync-status synced" id="sync-indicator">🟢 Hazır (LocalDB)</div>
      <div class="history-controls">
        <select id="history-dropdown"></select>
        <button id="new-session-btn">+ Yeni</button>
      </div>
    </div>

    <div class="header">
      <div class="app-title">⚡ KasaPratik Sayacı</div>
      <div class="grand-total" id="grand-total">0,00 <span>₺</span></div>
    </div>

    <div class="denominations-list" id="list-container"></div>

    <div class="footer">
      <div class="footer-note">İşlem yapmak için <b>+</b> ve <b>-</b> kullanabilirsiniz (Örn: 10-2+5).</div>
      <div class="copyright">Karaaslan © 2026</div>
    </div>
  </div>

  <script>
    const denominations = [200, 100, 50, 20, 10, 5, 1, 0.50, 0.25, 0.10, 0.05];
    const container = document.getElementById('list-container');
    const historyDropdown = document.getElementById('history-dropdown');
    const syncIndicator = document.getElementById('sync-indicator');
    const inputs = [];
    
    let currentSessionId = null;
    let saveTimeout = null;

    // Arayüz Kurulumu
    denominations.forEach((denom, index) => {
      const row = document.createElement('div');
      row.className = 'row';
      const labelText = denom >= 1 ? `${denom} ₺` : `${(denom * 100).toFixed(0)} Kr`;

      row.innerHTML = `
        <div class="label">${labelText}</div>
        <div class="input-area">
          <span class="multiplier-icon">✖</span>
          <input type="text" inputmode="text" placeholder="0" data-value="${denom}" id="input-${index}">
          <span class="count-display" id="count-${index}"></span>
        </div>
        <div class="row-total" id="total-${index}">0,00 ₺</div>
      `;
      container.appendChild(row);
      
      const input = document.getElementById(`input-${index}`);
      inputs.push(input);

      // Klavye Yönlendirmeleri
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === 'ArrowDown') {
          e.preventDefault(); 
          if (index + 1 < inputs.length) inputs[index + 1].focus(); 
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (index - 1 >= 0) inputs[index - 1].focus(); 
        }
      });

      // Her tuş basımında hesapla ve kaydet
      input.addEventListener('input', () => {
        calculateRow(index);
        calculateGrandTotal();
        triggerAutoSave();
      });
    });

    const formatMoney = (amount) => amount.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const evaluateInput = (value) => {
      if (!value) return 0;
      const sanitized = value.replace(/[^0-9+\-]/g, '');
      if (!sanitized) return 0;
      const parts = sanitized.replace(/-/g, '+-').split('+');
      return parts.reduce((total, num) => total + (isNaN(parseInt(num)) ? 0 : parseInt(num)), 0);
    };

    function calculateRow(index) {
      const input = inputs[index];
      const denom = parseFloat(input.getAttribute('data-value'));
      const count = evaluateInput(input.value);
      const rowTotal = count * denom;
      const rowDiv = input.closest('.row');
      
      if (count !== 0) {
        document.getElementById(`count-${index}`).innerText = `= ${count}`;
      } else {
        document.getElementById(`count-${index}`).innerText = '';
      }
      document.getElementById(`total-${index}`).innerText = `${formatMoney(rowTotal)} ₺`;

      rowDiv.classList.remove('has-value', 'negative-value');
      if (count > 0) rowDiv.classList.add('has-value');
      else if (count < 0) rowDiv.classList.add('negative-value');
    }

    function calculateGrandTotal() {
      let grandTotal = 0;
      inputs.forEach(input => {
        grandTotal += evaluateInput(input.value) * parseFloat(input.getAttribute('data-value'));
      });
      document.getElementById('grand-total').innerHTML = `${formatMoney(grandTotal)} <span>₺</span>`;
    }

    // --- VERİTABANI (LocalDB) İŞLEMLERİ ---

    function getDB() {
      const db = localStorage.getItem('kasaPratikDB');
      return db ? JSON.parse(db) : [];
    }

    function saveToDB(sessions) {
      localStorage.setItem('kasaPratikDB', JSON.stringify(sessions));
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return `${d.toLocaleDateString('tr-TR')} ${d.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'})}`;
    }

    function loadHistoryDropdown() {
      const sessions = getDB();
      historyDropdown.innerHTML = '';
      if (sessions.length === 0) {
        const opt = document.createElement('option');
        opt.text = "Kayıt Yok";
        historyDropdown.add(opt);
        return;
      }
      
      // En yeniler en üstte
      sessions.sort((a, b) => b.id - a.id).forEach(session => {
        const opt = document.createElement('option');
        opt.value = session.id;
        opt.text = formatDate(session.id);
        historyDropdown.add(opt);
      });
      
      historyDropdown.value = currentSessionId;
    }

    function createNewSession() {
      const newId = Date.now();
      currentSessionId = newId;
      const sessions = getDB();
      
      // Yeni oturumu kaydet
      sessions.push({ id: newId, data: {} });
      saveToDB(sessions);
      
      // Formu temizle
      inputs.forEach((input, i) => {
        input.value = '';
        calculateRow(i);
      });
      calculateGrandTotal();
      
      loadHistoryDropdown();
      setSyncStatus("🟢 Senkronize (LocalDB)", "synced");
      inputs[0].focus();
    }

    function loadSessionData(id) {
      const sessions = getDB();
      const session = sessions.find(s => s.id == id);
      if (!session) return;
      
      currentSessionId = id;
      inputs.forEach((input, i) => {
        const denom = input.getAttribute('data-value');
        input.value = session.data[denom] || '';
        calculateRow(i);
      });
      calculateGrandTotal();
      setSyncStatus("🟢 Yüklendi (LocalDB)", "synced");
    }

    function setSyncStatus(text, className) {
      syncIndicator.innerText = text;
      syncIndicator.className = `sync-status ${className}`;
    }

    function triggerAutoSave() {
      setSyncStatus("🟡 Kaydediliyor...", "syncing");
      clearTimeout(saveTimeout);
      
      saveTimeout = setTimeout(() => {
        if (!currentSessionId) return;
        
        const sessions = getDB();
        const sessionIndex = sessions.findIndex(s => s.id == currentSessionId);
        
        if (sessionIndex > -1) {
          const currentData = {};
          inputs.forEach(input => {
            if (input.value) currentData[input.getAttribute('data-value')] = input.value;
          });
          sessions[sessionIndex].data = currentData;
          saveToDB(sessions);
          setSyncStatus("🟢 Kaydedildi (LocalDB)", "synced");
        }
      }, 800); // 0.8 saniye bekle ve kaydet (yazarken yormamak için)
    }

    // --- OLAY DİNLEYİCİLERİ ---

    document.getElementById('new-session-btn').addEventListener('click', createNewSession);

    historyDropdown.addEventListener('change', (e) => {
      if (e.target.value) loadSessionData(e.target.value);
    });

    window.onload = () => {
      const sessions = getDB();
      if (sessions.length > 0) {
        // En son sayımı yükle
        const lastSession = sessions.sort((a, b) => b.id - a.id)[0];
        loadHistoryDropdown();
        loadSessionData(lastSession.id);
        historyDropdown.value = lastSession.id;
      } else {
        // Hiç kayıt yoksa yeni aç
        createNewSession();
      }
      
      if (inputs.length > 0) inputs[0].focus();
    };
  </script>

</body>
</html>
